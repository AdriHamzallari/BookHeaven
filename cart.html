<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookHaven - Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/global.css">
</head>
<body>

<nav>
  <h1>📚 BookHaven</h1>
  <ul class="nav-links">
    <li><a href="index.html" class="nav-btn">Home</a></li>
    <li><a href="browse.html" class="nav-btn">Browse</a></li>
    <li><a href="wishlist.html" class="nav-btn">Wishlist</a></li>
    <li><a href="library.html" class="nav-btn">Library</a></li>
    <li><a href="cart.html" class="nav-btn cart-badge" data-count="0">Cart</a></li>
    <li><a href="profile.html" class="nav-btn">Profile</a></li>
  </ul>
</nav>

<!-- MAIN CONTAINER -->
<main class="cart-container">
    
    <!-- 1. INFO SECTION: Title and Summary Count -->
    <section id="info-section">
        <!-- JS will inject: <h1 class="page-title">Your Cart</h1> -->
        <!-- JS will inject: <div class="cart-summary">...</div> -->
    </section>

    <!-- 2. GRID SECTION: The Book Cards -->
    <section class="cart-items" id="cart-grid">
        <!-- JS will inject cards here -->
    </section>

    <!-- 3. CHECKOUT SECTION: Final Total and Payment Button -->
    <section id="checkout-section" class="checkout-footer">
        <!-- JS will inject Total Price and "Checkout Now" button here -->
    </section>

</main>
<!-- CHECKOUT MODAL -->
<div id="checkout-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Confirm Your Order</h2>
      <button id="close-modal" class="close-btn">&times;</button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label for="user-name">Full Name</label>
        <input type="text" id="user-name" placeholder="Enter your name" required>
      </div>
      
      <div class="order-preview">
        <h4>Order Summary</h4>
        <ul id="modal-item-list">
          <!-- JS will inject list items here -->
        </ul>
        <div class="modal-total">
          <span>Total to Pay:</span>
          <strong id="modal-total-amount">$0.00</strong>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button id="cancel-purchase" class="btn-secondary">Cancel</button>
      <button id="confirm-purchase" class="btn-confirm">Confirm & Pay</button>
    </div>
  </div>
</div>

<footer>
  © 2026 BookHaven. Crafted for readers who love stories.
</footer>

<script src="js/cart.js"></script>
</body>
</html>
