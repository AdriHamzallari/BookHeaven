<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookHaven - Profile</title>
<link rel="stylesheet" href="css/global.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/profile.css">
</head>
<body>

<nav>
  <h1>📚 BookHaven</h1>
  <ul class="nav-links">
    <li><a href="index.html" class="nav-btn">Home</a></li>
    <li><a href="browse.html" class="nav-btn">Browse</a></li>
    <li><a href="wishlist.html" class="nav-btn">Wishlist</a></li>
    <li><a href="library.html" class="nav-btn">Library</a></li>
    <li><a href="cart.html" class="nav-btn cart-badge" data-count="0">Cart</a></li>
    <li><a href="profile.html" class="nav-btn active">Profile</a></li>
  </ul>
</nav>

<section class="profile-page">

  <div class="profile-header">
    <div class="avatar">👤</div>
    <div class="user-info">
      <h1 id="display-name">---</h1>
      <div class="user-email" id="display-email">---</div>
      <div class="join-date">Member since January 2025</div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-number" id="nb-books">0</div>
      <div class="stat-label">Books in Library</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="nb-read">0</div>
      <div class="stat-label">Books Read This Year</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="nb-wishlist">0</div>
      <div class="stat-label">Wishlist Items</div>
    </div>
    <div class="stat-card">
      <div class="stat-number" id="nb-bought">0</div>
      <div class="stat-label">Purchases</div>
    </div>
  </div>

  <div class="section">
    <h2>Recent Activity</h2>
    <div class="recent-activity">
      <!-- Generated by JS: Last books bought -->
    </div>
  </div>

  <div class="section">
    <h2>Currently Reading</h2>
    <div class="reading-list">
      <!-- Generated by JS: 3 most recent books -->
    </div>
  </div>

  <div class="section">
    <h2>Account Settings</h2>
    <div class="settings-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your email">
      </div>
      <div class="form-group">
        <label for="password">Change Password</label>
        <input type="password" id="password" placeholder="New password">
      </div>
      <button type="button" class="btn btn-primary" id="save-settings">Save Changes</button>
    </div>
  </div>

</section>

<footer>
  © 2026 BookHaven. Crafted for readers who love stories.
</footer>

<script src="js/profile.js"></script>
</body>
</html>
